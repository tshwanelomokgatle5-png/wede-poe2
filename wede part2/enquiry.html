<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>Fresh Bakes Bakery - Custom Cake & General Enquiry</title> 

    <style> 

        body { 

            font-family: Arial, sans-serif; 

            margin: 0; 

            padding: 0; 

            background-color: #FAF0E6; 

            color: #3E2723; 

        } 

        header { 

            background-color: #5C4033; 

            color: #FFFFFF; 

            padding: 20px; 

            text-align: center; 

        } 

        nav { 

            background-color: #8B5A2B; 

            text-align: center; 

            padding: 10px; 

        } 

        nav a { 

            color: #FFFFFF; 

            text-decoration: none; 

            margin: 0 15px; 

            font-weight: bold; 

        } 

        .container { 

            max-width: 600px; 

            margin: 20px auto; 

            background: #FFFFFF; 

            padding: 25px; 

            border-radius: 8px; 

        } 

        label { 

            display: block; 

            margin-top: 15px; 

            font-weight: bold; 

        } 

        input, select, textarea { 

            width: 100%; 

            padding: 10px; 

            margin-top: 5px; 

            border: 1px solid #ccc; 

            border-radius: 4px; 

            box-sizing: border-box; 

        } 

        button { 

            background-color: #8B5A2B; 

            color: white; 

            border: none; 

            padding: 12px 20px; 

            margin-top: 20px; 

            cursor: pointer; 

            width: 100%; 

            border-radius: 4px; 

            font-size: 16px; 

        } 

        button:hover { 

            background-color: #5C4033; 

        } 

        footer { 

            background-color: #5C4033; 

            color: #FFFFFF; 

            text-align: center; 

            padding: 15px; 

            margin-top: 30px; 

        } 

    </style> 

</head> 

<body> 

 

    <header> 

        <h1>Order & Custom Cake Enquiry</h1> 

    </header> 

 

    <nav> 

        <a href="index.html">Home</a> 

        <a href="about.html">About Us</a> 

        <a href="products.html">Products</a> 

        <a href="enquiry.html">Enquiry</a> 

        <a href="contact.html">Contact Us</a> 

    </nav> 

 

    <main class="container"> 

        <h2>Send Us an Enquiry</h2> 

        <form action="#" method="post"> 

            <label for="fullname">Full Name:</label> 

            <input type="text" id="fullname" name="fullname" required placeholder="Your full name"> 

 

            <label for="email">Email Address:</label> 

            <input type="email" id="email" name="email" required placeholder="Your email address"> 

 

            <label for="phone">Phone Number:</label> 

            <input type="tel" id="phone" name="phone" placeholder="Your phone number"> 

 

            <label for="type">Enquiry Type:</label> 

            <select id="type" name="type"> 

                <option value="custom-cake">Custom Cake Order</option> 

                <option value="event-catering">Event Catering</option> 

                <option value="general">General Question</option> 

            </select> 

 

            <label for="message">Enquiry Details:</label> 

            <textarea id="message" name="message" rows="5" required placeholder="Describe what you would like to order or ask..."></textarea> 

 

            <button type="submit">Submit Enquiry</button> 

        </form> 

    </main> 

 

    <footer> 

        <p>&copy; 2026 Fresh Bakes Bakery. All Rights Reserved.</p> 

    </footer> 

 

</body> 

</html>
